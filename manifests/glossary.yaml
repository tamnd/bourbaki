      vi: A-môđun
      zh: A-模
      ja: A-加群
      note: 'The ring is written in front and its letter is a capital, A-môđun and not môđun trên a, because the letter is the symbol the book uses and a lower case one is a different symbol. This row and the forty three like it were set by hand together. A mining pass lower cases the English it reads, so every rendering of this family came back with a lower case ring, and three of them had lost the ring altogether: a-module came back as môđun, which is any module over anything, a-submodule as môđun con, and d-vector space as không gian vectơ d chiều, a d dimensional one.'
