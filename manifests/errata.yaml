# Where a printing is wrong. Written by hand, read by bourbaki assemble.
# The printed words stay as they are in content/ and the correction lives here.
errata:
    - label: alg-viii-s1-ex-3
      lang: en
      errata:
        - says: K is finite-dimensional over $K'$
          read: K is infinite-dimensional over $K'$
          why: The right ideals of A are the $K'$-subspaces of K, so the deduction the
            exercise asks for holds exactly when K is infinite over $K'$, and the French
            of 1981 (A VIII.13) reads "de dimension infinie sur $K'$".
    - label: ens-ii-s5
      lang: en
      errata:
        - says: Proposition 1, Corollary 5
          read: Proposition 6, Corollary 1
          why: Section 5 prints five corollaries in no. 4 and all five stand under
            Proposition 6, which is on page 105 and is the auxiliary the no. announces
            with "it is enough to prove the following proposition". Proposition 1 has
            no corollary at all, so there is no Corollary 5 of it. The sentence citing
            this, on page 106, needs the projection of a product onto a factor to be
            surjective, and that is Corollary 1 of Proposition 6, whose proof reads
            "Apply Proposition 5 to the subset J = {alpha} of I".
        - says: Proposition 5, Corollary 2
          read: Proposition 6, Corollary 2
          why: The volume hangs these five corollaries on Proposition 5 four times over
            and on Proposition 6 once, and the page prints them under Proposition 6. The
            fact wanted in both sentences here, on pages 108 and 109, is that a product
            is empty exactly when one of its factors is, which is Corollary 2.
            Proposition 5 is the statement about a partial product that the proof of
            Corollary 1 applies, and it carries no corollary of its own.
        - says: Corollary 2 to Proposition 5
          read: Corollary 2 to Proposition 6
          why: The same reference as the two above, written the other way round on page
            109, and wrong the same way.
    - label: ens-iii-s3
      lang: en
      errata:
        - says: § 5, no. 4, Proposition 5, Corollary 2
          read: § 5, no. 4, Proposition 6, Corollary 2
          why: The sentence on page 157 is a translation of the condition that a product
            set should be non-empty, which is Corollary 2 of no. 4 of § 5 of chapter II.
            The five corollaries of that no. are printed under Proposition 6 and the
            volume names them under Proposition 5 here as it does three times in chapter
            II itself.
        - says: § 6, no. 3, Theorem 3
          read: § 6, no. 3, Theorem 2
          why: Section 6 has no Theorem 3. No. 3 prints Theorem 2 on page 186, then Lemma
            1 and Lemma 2, then the proof of Theorem 2 on page 187, then four corollaries
            on page 188. The Corollary 4 this sentence cites with it is the one that puts
            the product of two cardinals, one of them infinite, at their supremum, which
            is Corollary 4 of Theorem 2 and is what the sentence is about.
    - label: ens-iii-s7
      lang: en
      errata:
        - says: no. 2, Proposition 2, Corollary 2
          read: no. 2, Proposition 1, Corollary 2
          why: The fact cited on page 197 is that the maps of an inverse system compose,
            h to the lambda nu being h to the lambda mu after h to the mu nu, and that is
            Corollary 2 of Proposition 1 of no. 2, the corollary on three inverse
            systems. Proposition 2 of that no. prints one corollary and it carries no
            number.
    - label: ens-iv-s2-ex-9
      lang: en
      errata:
        - says: Example 2 of no. 4
          read: Example 2 of § 1, no. 4
          why: No. 4 of section 2 numbers no examples. It sets its three under the run-in
            titles I. Inverse image of a structure, II. Induced structure and III.
            Product structure, on pages 279 to 281, and none of the three is about
            homomorphisms. Example 2 of no. 4 of section 1 is the species of structures
            with a single internal law of composition, everywhere defined, and it is the
            example the word homomorphism is defined against on page 276, where no. 1 of
            section 2 opens "Take Sigma to be a species of algebraic structures which
            has a single (internal) law of composition, everywhere defined (§ 1, no. 4,
            Example 2)". Exercise 8, printed on the same page 293 as this one, writes
            the same citation with its section in front of it, "the axiom of the species
            of topological structures (§ 1, no. 4, Example 3)".
    - label: lie-ix-s9
      lang: en
      errata:
        - says: §5, no. 2, Cor. of Prop. 2
          read: §5, no. 2, Cor. 1 of Prop. 2
          why: No. 2 of section 5 prints three numbered corollaries of Proposition 2 and
            the reference does not say which. The sentence citing it has G simply-connected
            and A an alcove, and says that the composite map from A to $G_r/$Int(G) is a
            homeomorphism. That is Corollary 1 b), whose homeomorphisms run $A/H_A$ to
            $T_r/W$ to $G_r/$Int(G) and whose $H_A$ is trivial for a simply-connected
            group. Corollary 2 is the same statement for the Lie algebra, over a chamber
            rather than an alcove, and Corollary 3 is about existence and uniqueness and
            names no map at all.
    - label: lie-viii-s5
      lang: en
      errata:
        - says: Chap. VII, §13, no. 1
          read: Chap. VIII, §13, no. 1
          why: Chapter VII has five sections and no section 13. The sentence says that the
            groups Aut$_0(\mathfrak{g})$ and Aut$_e(\mathfrak{g})$ can be distinct, and the
            place that shows it is no. 1 of section 13 of this chapter, on the algebras of
            type $A_l$, which computes Aut$_0(\mathfrak{g}) =\varphi (\mathbf{G}\mathbf{L}(l+
            1, k))$, identifies the quotient Aut$_0(\mathfrak{g})/$Aut$_e(\mathfrak{g})$
            with $\mathbf{P}\mathbf{G}\mathbf{L}(l+ 1, k)/\mathbf{P}\mathbf{S}\mathbf{L}(l+
            1, k)$, and over the reals finds it isomorphic to $\mathbf{Z}/2\mathbf{Z}$ when
            $l+1$ is even. Chapter VII names neither group anywhere.
    - label: lie-viii-s10-ex-5
      lang: en
      errata:
        - says: Cor. 2 of Th. 1
          read: Cor. 2 of Th. 2
          why: Section 10 prints no corollary under its Theorem 1. Theorem 1 is on page
            167, Lemma 1 and Definition 1 stand between, Theorem 2 is on page 169 and
            both Corollary 1 and Corollary 2 follow it on page 170. Corollary 2 is the
            statement this exercise is using, that a subalgebra of nilpotent elements
            lies in the nilradical of a parabolic subalgebra.
    - label: lie-viii-s10-ex-6
      lang: en
      errata:
        - says: Cor. 2 of Th. 1
          read: Cor. 2 of Th. 2
          why: The same reference as exercise 5 of this section, and wrong the same way.
            Both corollaries of section 10 are printed under Theorem 2 on page 170.
    - label: lie-viii-s11-ex-9
      lang: en
      errata:
        - says: Cor. 2 of Th. 1 of §10
          read: Cor. 2 of Th. 2 of §10
          why: Section 10 has no corollary under its Theorem 1. Corollary 2 of its Theorem
            2 is the one that puts a subalgebra of nilpotent elements inside a parabolic
            subalgebra, which is what this exercise needs to show that P is dense in N.
    - label: lie-viii-s11-ex-10
      lang: en
      errata:
        - says: §10, Cor. 2 of Th. 1
          read: §10, Cor. 2 of Th. 2
          why: Section 10 has no corollary under its Theorem 1. The fact this exercise is
            reproving, that every nilpotent element lies in a Borel subalgebra, is
            Corollary 2 of Theorem 2 on page 170.

# The table of contents of a volume, corrected before bourbaki toc build reads it.
# These are errors of the Acrobat text layer and of the printing itself, not of the
# reading of the pages.
contents:
    - book: ens-i-iv
      errata:
        - says: '3. Met?ods .of proof.'
          read: '3. Methods of proof.'
          why: The Acrobat text layer of the printed contents, pdf page 9, reads Met?ods
            .of where the page prints Methods of.
        - says: '4. ConjunctIon'
          read: '4. Conjunction'
          why: The text layer of the printed contents, pdf page 9, capitalises the i of
            Conjunction.
        - says: '7. Complement ofa set. The empty set'
          read: '7. Complement of a set. The empty set'
          why: The text layer of the printed contents, pdf page 10, runs of a together
            into ofa.
        - says: '§ 5. Product ofa family of sets'
          read: '§ 5. Product of a family of sets'
          why: The text layer of the printed contents, pdf page 11, runs of a together
            into ofa.
        - says: '1. Definition oran order relation'
          read: '1. Definition of an order relation'
          why: The text layer of the printed contents, pdf page 12, reads of an as oran.
        - says: '4. Ordered subsets. Product or ordered sets'
          read: '4. Ordered subsets. Product of ordered sets'
          why: The text layer of the printed contents, pdf page 12, reads of as or.
        - says: '5. Increasing mappings ................. ''" ... .... ..'
          read: '5. Increasing mappings ...............................'
          why: The text layer of the printed contents, pdf page 12, sets a stray quote
            mark in the run of leader dots, and the reader takes it for the end of the
            title.
        - says: '7. Greatest dement and least dement'
          read: '7. Greatest element and least element'
          why: The text layer of the printed contents, pdf page 12, reads element as
            dement, twice on the one line.
        - says: '§ 2. Wdl-ordered sets'
          read: '§ 2. Well-ordered sets'
          why: The text layer of the printed contents, pdf page 12, reads Well- as Wdl-.
        - says: '5. Isomorphisms orwell-ordered sets.'
          read: '5. Isomorphisms of well-ordered sets.'
          why: The text layer of the printed contents, pdf page 12, runs of well
            together into orwell.
        - says: '§ 3. Equipotent sets. Cardinals ................. ''" ...... "'
          read: '§ 3. Equipotent sets. Cardinals .............................'
          why: The text layer of the printed contents, pdf page 12, sets two stray quote
            marks in the run of leader dots, and the reader takes the first for the end
            of the title.
        - says: '3. Properties of infinite cardinals ...... " ...... , . . . . ..'
          read: '3. Properties of infinite cardinals .......................'
          why: The text layer of the printed contents, pdf page 13, sets a stray quote
            mark and a comma in the run of leader dots.
        - says: '6. Examples of final structures ..... " .... ............'
          read: '6. Examples of final structures ..........................'
          why: The text layer of the printed contents, pdf page 14, sets a stray quote
            mark in the run of leader dots.
        - says: '5. Direct limits ....................................                                            201'
          read: '5. Direct limits ....................................                                            202'
          why: The contents of chapter III puts no. 5 of § 7 on page 201 and the volume
            prints its heading on page 202. Page 201 is no. 4 throughout, from the end
            of the proof of Theorem 1 to the Remark that weakens its condition (iii),
            and it ends in a display; page 202 opens on the two Examples that close no.
            4 and then heads DIRECT LIMITS. The running head of 201 is CONDITIONS FOR AN
            INVERSE LIMIT TO BE NON-EMPTY, § 7.4, and the first page whose running head
            reads DIRECT LIMITS is 203.
