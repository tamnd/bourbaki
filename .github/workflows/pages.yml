name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and a queued run waits rather than cancelling the one in
# flight. A cancelled deploy leaves Pages serving half a site, and half a site
# is worse than the site it replaced.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is a pure function of the committed Markdown, the tags and the
  # reference manifests. No PDF, no work/ directory, no network, which is what
  # lets it be built here at all, where none of those are.
  build:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.site.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tamnd/bourbaki-solver
          path: .solver
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .solver/go.sum

      # The gate on every pull request. It builds every page, sets every formula
      # through KaTeX and fails on a tag that resolves to nothing.
      #
      # -max-broken is a ceiling and not a target. The text layer of the printed
      # volumes lost formulae, mostly a prime read as an underscore and a
      # subscript that swallowed the character after it, and they are being
      # repaired page by page in tamnd/bourbaki-solver#3. Until that is done a
      # plain build refuses to write a site at all, so the numbers here are what
      # hold the line: a change that breaks a formula that used to set fails
      # this check, and a number comes down as the pages are repaired and never
      # goes up. When they all reach zero this flag comes off and P04 becomes
      # hard.
      #
      # One number per volume and not one for the corpus. A total would let a
      # volume that got worse hide behind a volume that got better, and catching
      # that is the whole of what this is for. It is also what lets a new volume
      # in: the first chapter arrived carrying 204 and came down to 51 over five
      # rounds of repair, and a volume that has had none of those rounds cannot
      # enter under a number tuned by them.
      #
      # en/alg and fr/alg: 204 to 94 with the prime repair, 94 to 77 once the
      # dangerous bend stopped being written as a command no renderer here
      # loads, 77 to 69 by taking back the paragraphs of the pages repaired by
      # hand that the extractor now reads better than the repair did, 69 to 60
      # once a base carrying a prime was braced before it takes a superscript of
      # its own, 60 to 51 once an index was let stand a glyph box wider than the
      # exponent written across it, and 51 to 44 once a large operator was put
      # back on the line it is drawn on. That 44 is the 25 and the 19 below.
      #
      # en/lie entered at 68, down from the 95 it first measured once a prime
      # was never read as an index again, 68 to 56 once a minus that is an index
      # stopped being read as the hyphen of a compound word, and 56 to 41 with
      # that same repair to the operators. poppler reports the top of an
      # extension glyph truly and its height as junk, but the foot it makes of
      # the two lands a few units inside the band of the line the operator is
      # drawn on, which is enough to place it, and a limit wider than its sign
      # is then measured by the half of itself drawn to the right, which nothing
      # was written across. What is left of that volume, and most of what is
      # left of the other two, is double superscripts and double subscripts,
      # which are the same fault twice over: the line gathering ran two display
      # lines together, or set a matrix inline, and the scripts of one landed on
      # the scripts of the other.
      #
      # fr/ta and fr/ts enter at the numbers they measure, 59 and 80, and they
      # have had none of the rounds of repair the other three have had. Both are
      # mostly the double scripts described above, and the rest is the shape
      # Topologie générale writes the inverse image with: the minus one is set
      # over the letter rather than after it, and the layer reports the minus in
      # front of the letter and the one behind it, so a page ends up saying
      # ^-f^1 where it printed the inverse image of f. There are twelve of
      # those and they want the same treatment the other split index got, which
      # is a reading of the geometry and not a table.
      - name: publish -check
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki publish -check -max-broken en/alg=25,fr/alg=19,en/lie=41,fr/ta=59,fr/ts=80

      # Where Pages will serve this from, asked rather than typed, so the links
      # are right under tamnd.github.io/bourbaki and under a custom domain both.
      - uses: actions/configure-pages@v5
        id: pages
        if: github.ref == 'refs/heads/main'

      # The deploy build, with no flag that would let a broken formula through.
      # A site that quietly prints the TeX of a formula the extraction got wrong
      # puts the fault in front of a reader in a form that looks deliberate, so
      # publish refuses to write one, and this refuses to deploy rather than
      # deploying something worse.
      #
      # It says so on the run summary instead of failing the job. The chapter
      # has carried this damage since it was extracted, it is tracked and it is
      # being worked, and a build that is red every day for a month is a build
      # nobody reads.
      - name: build the site
        id: site
        if: github.ref == 'refs/heads/main'
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: |
          if go run ./cmd/bourbaki publish -out "$GITHUB_WORKSPACE/site" \
               -base "${{ steps.pages.outputs.base_path }}"; then
            echo "publishable=yes" >> "$GITHUB_OUTPUT"
            echo "The site was built and is being deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publishable=no" >> "$GITHUB_OUTPUT"
            {
              echo "## Built, not deployed"
              echo
              echo "publish will not write a site containing a formula KaTeX cannot set, and the"
              echo "chapter still carries the ones the text layer of the PDF lost. Nothing was"
              echo "deployed and nothing was overwritten. Run \`bourbaki audit -only P04\` for the"
              echo "list, and see tamnd/bourbaki-solver#3 for the repair."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.publishable == 'yes'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publishable == 'yes'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
