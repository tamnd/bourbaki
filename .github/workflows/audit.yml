name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The volumes are copyrighted and the page renders are large. Neither belongs in
  # git, and .gitignore only stops the ones nobody adds by hand. This job is the
  # part that fails the build when someone does.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no PDFs or page images
        run: |
          bad=$(git ls-files -- '*.pdf' '*.png' '*.jpg' '*.jpeg' '*.tif' '*.tiff' '*.ppm' '*.pgm')
          if [ -n "$bad" ]; then
            echo "these are committed and must not be:"
            echo "$bad"
            exit 1
          fi
      - name: nothing over a megabyte
        run: |
          bad=$(git ls-files -z | xargs -0 -I{} sh -c 'set -- $(wc -c < "{}"); [ "$1" -gt 1048576 ] && echo "$1 {}"' || true)
          if [ -n "$bad" ]; then
            echo "these are larger than a megabyte:"
            echo "$bad"
            exit 1
          fi

  # Assembly is a pure function of pages/ and manifests/toc/. That is the
  # contract that lets it run here at all, where the PDFs are not and cannot be,
  # and this is what holds it: the sections are assembled again from the pages
  # and compared with the ones committed. A parser that gives a different answer
  # on the same input, or a section file edited by hand, fails the build.
  #
  # The corpus audit proper, tags resolved and figures present and the formulae
  # read back, is bourbaki audit, and it runs here too.
  corpus:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because one of the tag invariants is that tags/tags
      # was only ever appended to, and that is a fact about the history of the
      # file rather than about the file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tamnd/bourbaki-solver
          path: .solver
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .solver/go.sum
      - name: assemble -check
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book alg-viii -check
      # Both printings, because the two are assembled from different pages by
      # the same code and only the English was checked here. A repair to the
      # French pages therefore reached pages/ and stopped, and content/fr sat
      # eighteen files behind for as long as it took somebody to run assembly by
      # hand. A printing that is not checked is a printing that goes stale.
      - name: assemble -check, French
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book alg-viii-fr -lang fr -check
      # A volume that is not checked is a volume that goes stale, which the
      # French printing found out the hard way, so a volume is added here on the
      # same commit that adds its content.
      - name: assemble -check, Lie 7 to 9
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book lie-vii-ix -check
      # Theory of Sets is four chapters of four as of the commit that adds this,
      # so it is checked here from now on like the others.
      - name: assemble -check, Theory of Sets
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ens-i-iv -check
      - name: assemble -check, Topologie algébrique I to IV
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ta-i-iv-fr -lang fr -check
      # Théories spectrales is one volume in content/fr/ts and two books in
      # pages/, because it was printed in two, so both are checked and both
      # write into the same tree.
      - name: assemble -check, Théories spectrales I and II
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ts-i-ii-fr -lang fr -check
      - name: assemble -check, Théories spectrales III to V
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ts-iii-v-fr -lang fr -check
      - name: assemble -check, Integration I to VI
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book int-i-vi -partial -check
      - name: assemble -check, Topological Vector Spaces I to V
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book evt-i-v -partial -check
      - name: assemble -check, General Topology I to IV
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book top-i-iv -check
      # Algebre commutative chapitres 5 a 7 is the first French volume of
      # commutative algebra in content/, and it is checked whole rather than
      # partial because all three of its chapters read through.
      - name: assemble -check, Algèbre commutative V to VII
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ac-v-vii-fr -lang fr -check
      # Variétés is printed in two fascicules and only the first was assembled
      # for a long time, which is #356. Both are in content/ now, wrapped in a
      # nominal chapter each, and the second is the one that will go stale
      # quietly if nothing checks it: its pages were read by two different
      # models and had to be normalised by hand to assemble at all.
      - name: assemble -check, Variétés
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book var-fr -lang fr -partial -check
      # A tag is permanent under T05, so a volume is tagged once its pages have
      # settled and not before, and until the last volume is read the corpus is
      # meant to have statements waiting for one. That is a number that comes
      # down, not a broken invariant, and gating on it meant this step failed on
      # every branch from August on, taking the three steps after it with it.
      #
      # So it is held at a ceiling, like the formulae KaTeX refuses. The ceiling
      # comes down as Books are tagged and it does not go up. Everything else
      # tags verify checks still fails the build.
      - name: tags verify
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki tags verify -base origin/main -max-untagged 23308
      # The audit ran without its exit status being read for as long as the
      # corpus carried hard findings. It had twelve, every one a page where the
      # text layer lost half of a display, and gating on the count would have
      # meant a red build for months, which tells nobody anything.
      #
      # The count was zero when this step was written, and this step then sat
      # behind a tags verify that failed on every branch from August on, so it
      # has not run on a pull request since. It was 31555 when the ceiling went
      # in and is 30032 now, and #391 has the breakdown: 23308 of them are T03,
      # the statements waiting to be tagged, and most of the rest is volumes
      # that are not read through yet. The 1529 that have come off since are the
      # small mathematics rules read to nothing, the 102 seals the sweeps left
      # behind, 79 index files S12 could not see because it never read the two
      # manifest fields that name them, and 1246 bare glyphs that bourbaki fix
      # math turned back into their TeX: 644 once it was taught to read content/
      # as well as pages/, since a translation has no page under it, and 602
      # once its table was taught the operators as well as the letters. M03 was
      # 1251 and is 2, the last three being things it reported that were right.
      #
      # So it is held at a ceiling, and the ceiling comes down. A hard rule is
      # one that fails the build: the structure of a section file, a tag that
      # resolves to nothing, a figure that is not there, a reference that claims
      # to resolve and does not. What stays soft is what the extraction is still
      # working through, M09 and P04 and T10, and those are held by their own
      # counted ceilings elsewhere in these workflows rather than by this.
      #
      # The findings are written to JSON first and the exit status read after,
      # so a failing audit still annotates the diff with what failed instead of
      # stopping before it can say.
      #
      # reports/audit.md is gated too, and separately. It is regenerated here
      # and diffed against the one committed, so every soft finding is
      # enumerated in the repository by file and line, one more fails the build,
      # and fixing one fails the build until the report is regenerated and
      # committed. The report is the list, and this is what keeps the list
      # honest.
      #
      # The ceiling has gone up twice, and both times because the corpus grew
      # and not because anything broke.
      #
      # The second time is 30026 to 30032, for the second fascicule of
      # Variétés. Paragraphes 8 à 15 had been read and committed under pages/
      # for months and had never been assembled, which is #356; the eight
      # sections are in content/fr/var/2 now and the six are T03, statements
      # of the new sections waiting for a tag. tags verify moves with it, 23302
      # to 23308, because they are the same six counted by the other gate.
      # Nothing else in the audit moved: every other rule reports exactly what
      # it reported at 30026.
      #
      # The first time was 31555 to 31575. The Summary of Results of
      # Theory of Sets was assembled for the first time and its Vietnamese was
      # translated, and the twenty are S08 (5) on the new files, L01 (5), L03
      # (1), L05 (12) and L07 (1) on the new Vietnamese, less the four sections
      # resealed after the script normalisation. New text arriving with new
      # findings on it is what this number is supposed to record; it is not
      # supposed to move for any other reason, and #391 is where it comes down.
      #
      # -validate-tex turns on M04, the structural TeX parse, which is off by
      # default and had therefore never run anywhere. The first run of it over
      # the whole corpus reported 358 hard findings and every one was a formula
      # that is right, because it read the control space as a lost command name.
      # That is fixed in tamnd/bourbaki-solver#299 and the rule is at zero, so
      # it runs here now: a rule nothing ever runs is a rule that says nothing.
      - name: audit
        id: audit
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: |
          if go run ./cmd/bourbaki audit -validate-tex -report reports/audit.md \
               -json "$RUNNER_TEMP/audit.json" -max-hard 30032; then
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=$?" >> "$GITHUB_OUTPUT"
          fi
          test -f "$RUNNER_TEMP/audit.json"
      # Every finding carries a file and a line, so it can be put on the diff
      # where somebody reviewing the change will see it instead of in a log they
      # have to go and open.
      - name: annotate
        run: |
          python3 - "$RUNNER_TEMP/audit.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          for f in d.get("findings", []):
              level = "error" if f.get("hard") else "warning"
              where = ""
              if f.get("file"):
                  where = ",file=%s" % f["file"]
                  if f.get("line"):
                      where += ",line=%d" % f["line"]
              msg = f["message"].replace("\n", " ")
              print("::%s title=%s%s::%s" % (level, f["check"], where, msg))
          print("%d hard findings and %d soft" % (d["hard"], d["soft"]))
          PY
      - name: the audit report is up to date
        run: git diff --exit-code -- reports/audit.md
      # Read last, so a build that fails on it has already put every finding on
      # the diff and already said whether the report is stale. A gate that stops
      # the job before the annotations leaves a reviewer with a red tick and
      # nowhere to look.
      - name: no hard findings
        run: test "${{ steps.audit.outputs.status }}" -eq 0

  # The reference graph is a pure function of the Markdown too, so the manifest
  # and the four reports are checked rather than rebuilt. -min is the
  # milestone's own target.
  #
  # This is a job of its own and not a step of corpus, because what it measures
  # is not what corpus measures. corpus asks whether this branch broke
  # something. This asks how much of the Éléments is in the corpus yet, and the
  # answer is 83.2 per cent and will stay under the target until the volumes
  # listed in #358 are read: 1403 references give a page of a section that
  # records no book_pages, 809 name a numbered display whose \tag the reading
  # dropped, 326 are loc. cit., and the tail is statements that are simply not
  # read yet. Nothing about the threshold should be lowered to make this pass.
  #
  # Held as a step it hid the audit and publish -check behind it, which is the
  # same thing tags verify was doing and is the whole of #388. Held as a job it
  # is as red as it was and in nobody's way.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tamnd/bourbaki-solver
          path: .solver
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .solver/go.sum
      - name: refs build -check
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki refs build -check -min 90
