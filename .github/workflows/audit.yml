name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The volumes are copyrighted and the page renders are large. Neither belongs in
  # git, and .gitignore only stops the ones nobody adds by hand. This job is the
  # part that fails the build when someone does.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no PDFs or page images
        run: |
          bad=$(git ls-files -- '*.pdf' '*.png' '*.jpg' '*.jpeg' '*.tif' '*.tiff' '*.ppm' '*.pgm')
          if [ -n "$bad" ]; then
            echo "these are committed and must not be:"
            echo "$bad"
            exit 1
          fi
      - name: nothing over a megabyte
        run: |
          bad=$(git ls-files -z | xargs -0 -I{} sh -c 'set -- $(wc -c < "{}"); [ "$1" -gt 1048576 ] && echo "$1 {}"' || true)
          if [ -n "$bad" ]; then
            echo "these are larger than a megabyte:"
            echo "$bad"
            exit 1
          fi

  # Assembly is a pure function of pages/ and manifests/toc.yaml. That is the
  # contract that lets it run here at all, where the PDFs are not and cannot be,
  # and this is what holds it: the sections are assembled again from the pages
  # and compared with the ones committed. A parser that gives a different answer
  # on the same input, or a section file edited by hand, fails the build.
  #
  # The corpus audit proper, tags resolved and figures present and the formulae
  # read back, is bourbaki audit, and it runs here too.
  corpus:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because one of the tag invariants is that tags/tags
      # was only ever appended to, and that is a fact about the history of the
      # file rather than about the file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tamnd/bourbaki-solver
          path: .solver
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .solver/go.sum
      - name: assemble -check
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book alg-viii -check
      # Both printings, because the two are assembled from different pages by
      # the same code and only the English was checked here. A repair to the
      # French pages therefore reached pages/ and stopped, and content/fr sat
      # eighteen files behind for as long as it took somebody to run assembly by
      # hand. A printing that is not checked is a printing that goes stale.
      - name: assemble -check, French
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book alg-viii-fr -lang fr -check
      # A volume that is not checked is a volume that goes stale, which the
      # French printing found out the hard way, so a volume is added here on the
      # same commit that adds its content.
      - name: assemble -check, Lie 7 to 9
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book lie-vii-ix -check
      # Theory of Sets is four chapters of four as of the commit that adds this,
      # so it is checked here from now on like the others.
      - name: assemble -check, Theory of Sets
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ens-i-iv -check
      - name: assemble -check, Topologie algébrique I to IV
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ta-i-iv-fr -lang fr -check
      # Théories spectrales is one volume in content/fr/ts and two books in
      # pages/, because it was printed in two, so both are checked and both
      # write into the same tree.
      - name: assemble -check, Théories spectrales I and II
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ts-i-ii-fr -lang fr -check
      - name: assemble -check, Théories spectrales III to V
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book ts-iii-v-fr -lang fr -check
      - name: assemble -check, Integration I to VI
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book int-i-vi -partial -check
      - name: assemble -check, Topological Vector Spaces I to V
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki assemble -book evt-i-v -partial -check
      - name: tags verify
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki tags verify -base origin/main
      # The reference graph is a pure function of the Markdown too, so the
      # manifest and the four reports are checked rather than rebuilt. -min is
      # the milestone's own target and the corpus now clears it at 91.7 per
      # cent, so this is a regression gate rather than an aspiration. Of the
      # references that do not resolve, two thirds are the numbered displays and
      # the loc. cit. that resolve to nothing on purpose.
      - name: refs build -check
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: go run ./cmd/bourbaki refs build -check -min 90
      # The audit ran without its exit status being read for as long as the
      # corpus carried hard findings. It had twelve, every one a page where the
      # text layer lost half of a display, and gating on the count would have
      # meant a red build for months, which tells nobody anything.
      #
      # The count is zero and has been through the last several repairs, so the
      # exit status is read now. A hard rule is one that fails the build: the
      # structure of a section file, a tag that resolves to nothing, a figure
      # that is not there, a reference that claims to resolve and does not. What
      # stays soft is what the extraction is still working through, M09 and P04
      # and T10, and those are held by their own counted ceilings elsewhere in
      # these workflows rather than by this.
      #
      # The findings are written to JSON first and the exit status read after,
      # so a failing audit still annotates the diff with what failed instead of
      # stopping before it can say.
      #
      # reports/audit.md is gated too, and separately. It is regenerated here
      # and diffed against the one committed, so every soft finding is
      # enumerated in the repository by file and line, one more fails the build,
      # and fixing one fails the build until the report is regenerated and
      # committed. The report is the list, and this is what keeps the list
      # honest.
      #
      # -validate-tex turns on M04, the structural TeX parse, which is off by
      # default and had therefore never run anywhere. The first run of it over
      # the whole corpus reported 358 hard findings and every one was a formula
      # that is right, because it read the control space as a lost command name.
      # That is fixed in tamnd/bourbaki-solver#299 and the rule is at zero, so
      # it runs here now: a rule nothing ever runs is a rule that says nothing.
      - name: audit
        id: audit
        working-directory: .solver
        env:
          BOURBAKI_CORPUS: ${{ github.workspace }}
        run: |
          if go run ./cmd/bourbaki audit -validate-tex -report reports/audit.md \
               -json "$RUNNER_TEMP/audit.json"; then
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=$?" >> "$GITHUB_OUTPUT"
          fi
          test -f "$RUNNER_TEMP/audit.json"
      # Every finding carries a file and a line, so it can be put on the diff
      # where somebody reviewing the change will see it instead of in a log they
      # have to go and open.
      - name: annotate
        run: |
          python3 - "$RUNNER_TEMP/audit.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          for f in d.get("findings", []):
              level = "error" if f.get("hard") else "warning"
              where = ""
              if f.get("file"):
                  where = ",file=%s" % f["file"]
                  if f.get("line"):
                      where += ",line=%d" % f["line"]
              msg = f["message"].replace("\n", " ")
              print("::%s title=%s%s::%s" % (level, f["check"], where, msg))
          print("%d hard findings and %d soft" % (d["hard"], d["soft"]))
          PY
      - name: the audit report is up to date
        run: git diff --exit-code -- reports/audit.md
      # Read last, so a build that fails on it has already put every finding on
      # the diff and already said whether the report is stale. A gate that stops
      # the job before the annotations leaves a reviewer with a red tick and
      # nowhere to look.
      - name: no hard findings
        run: test "${{ steps.audit.outputs.status }}" -eq 0
